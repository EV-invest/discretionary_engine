# cargo-features = ["codegen-backend"]  # disabled due to aws-lc-rs incompatibility

[workspace]
members = ["discretionary_engine", "discretionary_engine_*"]
exclude = ["libs"]
resolver = "3"

default-members = ["discretionary_engine"]

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
float_cmp = "allow"
len_zero = "allow"
comparison_to_empty = "allow"
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

[workspace.dependencies]
clap = { version = "^4.5.60", features = ["derive", "env"] }
color-eyre = "^0.6.5"
derive_more = { version = "^2.1.1", features = ["from_str", "display", "from", "deref", "deref_mut"] }
insta = { version = "1.46.3", features = ["json"] }
jiff = "^0.2.22"
miette = { version = "7.6.0", features = ["fancy", "serde", "syntect-highlighter"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "^1.0.228", features = ["derive"] }
smart-default = "^0.7.1"
snapshot_fonts = "1.2.0"
strum = { version = "0.28", features = ["derive"] }
tracing = { version = "^0.1.44", features = ["log", "std", "async-await"] }
v_exchanges = { version = "^0.17.0", features = ["full"] }
v_utils = { version = "2.15.29", features = ["full"] }

#dbg: \
[patch.crates-io]
v_exchanges = { path = "../v_exchanges/v_exchanges" }
v_exchanges_adapters = { path = "../v_exchanges/v_exchanges_adapters" }
v_exchanges_api_generics = { path = "../v_exchanges/v_exchanges_api_generics" }
v_utils = { path = "../v_utils/v_utils" }
v_utils_macros = { path = "../v_utils/v_utils_macros" }

[profile.dev]
# codegen-backend = "cranelift"  # disabled due to aws-lc-rs incompatibility

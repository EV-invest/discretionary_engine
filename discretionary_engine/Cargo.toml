[package]
name = "discretionary_engine"
version = "1.0.0"
authors = ["Valera <valeratrades@gmail.com>"]
build = "build.rs"
categories = ["finance"]
description = "LaTeX of trading"
documentation = "https://docs.rs/discretionary_engine"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valeratrades/discretionary_engine"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
de_core = { path = "../discretionary_engine_core" }
de_macros = { path = "../discretionary_engine_macros", version = "^0.1.1" }
de_risk = { path = "../discretionary_engine_risk" }
de_routing = { path = "../discretionary_engine_routing" }
de_strategy = { path = "../discretionary_engine_strategy" }
nautilus-bybit = { path = "../libs/nautilus_trader/crates/adapters/bybit", default-features = false }
nautilus-model = { path = "../libs/nautilus_trader/crates/model" }

chrono = "^0.4.44"
clap_complete = "4.5.66"
config = "0.15.19"
console-subscriber = "0.5.0"
derive-new = "0.7.0"
dirs = "6.0"
eyre = "0.6.12"
function_name = "0.3.0"
futures-util = "0.3.32"
hex = "^0.4.3"
hmac = "^0.12.1"
rand = { version = "0.10.0" }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = "^1.0.149"
serde_path_to_error = "0.1.20"
serde_urlencoded = "^0.7.1"
serde_with = "^3.17.0"
sha2 = "^0.10.9"
tokio = { version = "^1.50.0", features = ["full", "tracing"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tracing-bunyan-formatter = "0.3.10"
tracing-error = "0.2.1"
tracing-log = "0.2.0"
tracing-subscriber = { version = "^0.3.22", features = ["fmt", "json", "registry", "env-filter"] }
url = "^2.5.8"
ustr = "1.1.0"
uuid = { version = "^1.21.0", features = ["serde", "v4", "v7", "v8"] }

clap.workspace = true
color-eyre.workspace = true
derive_more.workspace = true
jiff.workspace = true
miette.workspace = true
secrecy.workspace = true
smart-default.workspace = true
snapshot_fonts.workspace = true
strum.workspace = true
tracing.workspace = true
v_exchanges.workspace = true
v_utils.workspace = true

[dev-dependencies]
lazy_static = "1.5.0"

insta.workspace = true

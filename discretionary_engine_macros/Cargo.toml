[package]
name = "de_macros"
version = "0.1.1"
edition = "2024"
description = "macros for discretionary_engine"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn = { workspace = true, features = ["full", "extra-traits"] }

[dev-dependencies]
trybuild = { workspace = true, features = ["diff"] }

[[test]]
name = "tests"
path = "tests/main.rs"

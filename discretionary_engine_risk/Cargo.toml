[package]
name = "de_risk"
version = "1.0.0"
edition = "2024"

license = "MIT"
documentation = "https://docs.rs/discretionary_engine_risk"
repository = "https://github.com/valeratrades/discretionary_engine/tree/master/discretionary_engine_risk"
homepage = "https://github.com/valeratrades/discretionary_engine"
authors = ["valeratrades"]
description = "Risk-management library for discretionary_engine"
readme = "README.md"
build = "build.rs"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
ahash = { workspace = true, features = ["serde"] }
clap.workspace = true
color-eyre.workspace = true
de_core.workspace = true
exchange_interactions = { workspace = true, features = ["binance", "bybit", "kucoin", "mexc"] }
jiff.workspace = true
miette.workspace = true
smart-default.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
trading_data_core.workspace = true
v_utils.workspace = true

[dev-dependencies]
insta.workspace = true
snapshot_fonts.workspace = true

[lints]
workspace = true

[package]
name = "de_routing"
version = "0.1.0"
edition = "2024"

license = "MIT"
documentation = "https://docs.rs/discretionary_engine_routing"
repository = "https://github.com/valeratrades/discretionary_engine/tree/master/discretionary_engine_routing"
homepage = "https://github.com/valeratrades/discretionary_engine"
authors = ["valeratrades"]
description = "Route and reason about incoming detla change intents"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
de_macros = { path = "../discretionary_engine_macros" }
nautilus-bybit = { path = "../libs/nautilus_trader/crates/adapters/bybit", default-features = false } #dbg
nautilus-model = { path = "../libs/nautilus_trader/crates/model" } #dbg

derive-new = "0.7"
futures-util = "0.3.31"
redis = { version = "^1.0", features = ["tokio-comp", "streams"] }
tokio = { version = "^1.49.0", features = ["full", "signal"] }
tracing-subscriber = { version = "^0.3.22", features = ["fmt", "env-filter"] }

clap.workspace = true
color-eyre.workspace = true
derive_more.workspace = true
miette.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
v_exchanges.workspace = true
v_utils.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
